<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout - FORMA% HAUS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-off-white text-charcoal font-body">
  <header class="fixed top-0 left-0 w-full z-50 transition-all duration-300">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html">
        <img src="https://r2.flowith.net/files/2d4a2b22-5944-4bf1-9d9f-e4791f8fa491/3EWHP-FormeHaus-01-01@2000x1040.png" alt="FORMA% HAUS Logo" class="h-8 md:h-10 transition-all duration-300" id="header-logo">
      </a>
      <nav class="hidden md:flex items-center space-x-8 text-sm tracking-wider uppercase font-medium">
        <a href="index.html" class="nav-link" data-i18n="nav.home">Home</a>
        <a href="collections.html" class="nav-link" data-i18n="nav.collections">Collections</a>
        <a href="about.html" class="nav-link" data-i18n="nav.about">About</a>
        <a href="#" class="nav-link" data-i18n="nav.contact">Contact</a>
        <a id="admin-link" href="#" class="nav-link hidden">Admin</a>
        <!-- Language Toggle Switch -->
        <div class="relative inline-flex items-center ml-4">
          <div class="w-28 h-12 rounded-lg has-[:checked]:bg-deep-umber bg-off-white border-2 border-charcoal transition-colors duration-300">
            <div class="flex h-full w-full px-1.5 items-center gap-x-1.5">
              <div class="w-4 h-4 flex-shrink-0 rounded-full border-2 border-charcoal bg-soft-gold"></div>
              <label for="lang-toggle" class="has-[:checked]:scale-x-[-1] w-full h-8 border-2 border-charcoal rounded cursor-pointer overflow-hidden transition-transform duration-300 relative">
                <input type="checkbox" id="lang-toggle" class="hidden peer" />
                <div class="w-full h-full bg-soft-gold relative">
                  <!-- Top triangle -->
                  <div class="w-0 h-0 z-20 border-l-[16px] border-l-transparent border-r-[16px] border-r-transparent border-t-[14px] border-t-charcoal relative">
                    <div class="w-0 h-0 absolute border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[10px] border-t-soft-gold -top-[14px] -left-3"></div>
                  </div>
                  <!-- Left skewed panel -->
                  <div class="w-4 h-7 z-10 absolute top-2 left-0 bg-soft-gold border-r border-b-2 border-charcoal transform skew-y-[39deg]"></div>
                  <!-- Right skewed panel -->
                  <div class="w-4 h-7 z-10 absolute top-2 left-4 bg-[#c9a961] border-r-2 border-l border-b-2 border-charcoal transform skew-y-[-39deg]"></div>
                </div>
                <!-- Text Labels Outside - Counter-flip AR text -->
                <span id="lang-label-en" class="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-charcoal tracking-wider z-30 pointer-events-none">EN</span>
                <span id="lang-label-ar" class="absolute inset-0 hidden items-center justify-center text-[10px] font-bold text-charcoal tracking-wider z-30 pointer-events-none scale-x-[-1]">AR</span>
              </label>
              <div class="w-4 h-0.5 flex-shrink-0 bg-charcoal rounded-full"></div>
            </div>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="pt-32 pb-16 md:pt-40 md:pb-24">
    <div class="container mx-auto px-6">
      <div class="text-center mb-10">
        <h1 class="font-heading text-3xl md:text-4xl mb-8" data-i18n="checkout.title">Checkout</h1>
        
        <!-- Checkout Steps Progress Indicator -->
        <div class="max-w-4xl mx-auto mb-12">
          <div class="flex items-center justify-between relative">
            <!-- Progress Line Background -->
            <div class="absolute top-1/2 left-0 right-0 h-0.5 bg-gray-300 -translate-y-1/2 -z-10"></div>
            <div id="progress-line" class="absolute top-1/2 left-0 h-0.5 bg-soft-gold -translate-y-1/2 -z-10 transition-all duration-500" style="width: 0%"></div>
            
            <!-- Step 1: Shipping Address -->
            <div class="flex flex-col items-center flex-1">
              <div id="step-1" class="w-12 h-12 rounded-full bg-soft-gold text-white flex items-center justify-center font-semibold text-lg border-4 border-off-white transition-all duration-300">
                1
              </div>
              <span class="mt-2 text-sm font-medium">Shipping Address</span>
            </div>
            
            <!-- Step 2: Payment -->
            <div class="flex flex-col items-center flex-1">
              <div id="step-2" class="w-12 h-12 rounded-full bg-gray-300 text-charcoal flex items-center justify-center font-semibold text-lg border-4 border-off-white transition-all duration-300">
                2
              </div>
              <span class="mt-2 text-sm font-medium">Payment</span>
            </div>
            
            <!-- Step 3: Thank You -->
            <div class="flex flex-col items-center flex-1">
              <div id="step-3" class="w-12 h-12 rounded-full bg-gray-300 text-charcoal flex items-center justify-center font-semibold text-lg border-4 border-off-white transition-all duration-300">
                3
              </div>
              <span class="mt-2 text-sm font-medium">Thank You</span>
            </div>
          </div>
        </div>
      </div>

      <div class="grid md:grid-cols-3 gap-8">
        <div class="md:col-span-2 space-y-6">
          <!-- Customer Information -->
          <div class="bg-white p-6 border border-white/10">
            <h2 class="font-semibold mb-4">Customer Information</h2>
            <div class="space-y-4">
              <div>
                <label for="customer-email" class="block text-sm mb-1">Email</label>
                <input type="email" id="customer-email" class="w-full px-3 py-2 border border-gray-300" placeholder="your@email.com" required />
              </div>
            </div>
          </div>

          <!-- Shipping Address -->
          <div class="bg-white p-6 border border-white/10">
            <h2 class="font-semibold mb-4">Shipping Address</h2>
            <div class="space-y-4">
              <div class="grid md:grid-cols-2 gap-4">
                <div>
                  <label for="first-name" class="block text-sm mb-1">First Name</label>
                  <input type="text" id="first-name" class="w-full px-3 py-2 border border-gray-300" required />
                </div>
                <div>
                  <label for="last-name" class="block text-sm mb-1">Last Name</label>
                  <input type="text" id="last-name" class="w-full px-3 py-2 border border-gray-300" required />
                </div>
              </div>
              <div>
                <label for="address-1" class="block text-sm mb-1">Address Line 1</label>
                <input type="text" id="address-1" class="w-full px-3 py-2 border border-gray-300" required />
              </div>
              <div>
                <label for="address-2" class="block text-sm mb-1">Address Line 2 (Optional)</label>
                <input type="text" id="address-2" class="w-full px-3 py-2 border border-gray-300" />
              </div>
              <div class="grid md:grid-cols-3 gap-4">
                <div>
                  <label for="city" class="block text-sm mb-1">City</label>
                  <input type="text" id="city" class="w-full px-3 py-2 border border-gray-300" required />
                </div>
                <div>
                  <label for="postal-code" class="block text-sm mb-1">Postal Code</label>
                  <input type="text" id="postal-code" class="w-full px-3 py-2 border border-gray-300" required />
                </div>
                <div>
                  <label for="country-code" class="block text-sm mb-1">Country</label>
                  <input type="text" id="country-code" class="w-full px-3 py-2 border border-gray-300" placeholder="US" maxlength="2" required />
                </div>
              </div>
            </div>
          </div>

          <!-- Cart Summary -->
          <div class="bg-white p-6 border border-white/10">
            <h2 class="font-semibold mb-4">Cart Summary</h2>
            <div id="checkout-items" class="space-y-4"></div>
          </div>
        </div>
        
        <div class="space-y-6">
          <!-- Shipping Options -->
          <div class="bg-white p-6 border border-white/10">
            <h2 class="font-semibold mb-4">Shipping Method</h2>
            <div id="shipping-options" class="space-y-2"></div>
          </div>

          <!-- Order Summary -->
          <div class="bg-white p-6 border border-white/10">
            <div class="space-y-2 mb-4">
              <div class="flex items-center justify-between text-sm">
                <span>Subtotal</span>
                <span id="checkout-subtotal">$0.00</span>
              </div>
              <div class="flex items-center justify-between text-sm">
                <span>Shipping</span>
                <span id="checkout-shipping">$0.00</span>
              </div>
              <div class="flex items-center justify-between font-semibold pt-2 border-t">
                <span>Total</span>
                <span id="checkout-total">$0.00</span>
              </div>
            </div>
            <button id="start-payment" class="btn-primary w-full" data-i18n="checkout.pay">Proceed to Payment</button>
            <div id="payment-providers" class="mt-4 text-sm text-mid-grey"></div>
            <div id="checkout-status" class="mt-4 text-sm"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="checkout.js"></script>
</body>
</html>
